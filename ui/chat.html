<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
            background: #0b1120;
            color: #e2e8f0;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 380px;
            padding: 12px;
            box-sizing: border-box;
        }

        #chat {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 18px;
            border-radius: 10px;
            background: #111827;
            margin-bottom: 12px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.assistant {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 14px 16px;
            border-radius: 5px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user {
            background: #0ea5e9;
            color: white;
            border-bottom-right-radius: 2px;
            max-width: 80%;
        }

        .message.assistant {
            background: #1f2937;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
            max-width: 80%;
        }

        .controls {
            display: flex;
            flex-direction: row;
            gap: 6px;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.5em;
            height: 1.5em;
            transition: transform 0.15s ease, opacity 0.15s ease;
            padding: 2px;
        }

        .control-btn svg {
            width: 1em;
            height: 1em;
            stroke: #94a3b8;
            fill: none;
            stroke-width: 2;
            transition: stroke 0.25s ease;
        }

        .control-btn:active {
            transform: scale(0.8);
        }

        .control-btn.copied svg {
            stroke: #22c55e;
        }

        .control-btn.regenerating svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        #inputRow {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #input {
            width: 100%;
            height: auto;
            min-height: 70px;
            max-height: 280px;
            padding: 4px 6px;
            border-radius: 2px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.5;
            overflow-y: auto;
            resize: none;
            box-sizing: border-box;
        }

        #buttonRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #actionButtons {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        #send,
        #erase_history {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 2px;
            background: #111827;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.15s ease;
            transform-origin: center center;
            padding: 0;
        }

        #send:active,
        #erase_history:active {
            transform: scale(0.8);
        }

        #send:hover,
        #erase_history:hover {
            background: #1f2937;
        }

        select,
        input[type="number"] {
            padding: 2px 4px;
            border-radius: 2px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="chat"></div>
        <div id="footer">
            <div id="inputRow">
                <textarea id="input" rows="2" placeholder="Enter text to translate..."></textarea>
                <div id="buttonRow">
                    <div id="controls">
                        <!-- Controls for language selection and port -->
                         <!-- Traditional Chinese, French, Thai, Italian, German,  -->
                        <select id="sourceLang">
                            <option value="Chinese" {{selectedSourceChinese}}>Chinese</option>
                            <option value="Traditional Chinese" {{selectedSourceTraditionalChinese}}>Traditional Chinese</option>
                            <option value="English" {{selectedSourceEnglish}}>English</option>
                            <option value="Japanese" {{selectedSourceJapanese}}>Japanese</option>
                            <option value="Korean" {{selectedSourceKorean}}>Korean</option>
                            <option value="French" {{selectedSourceFrench}}>French</option>
                            <option value="Thai" {{selectedSourceThai}}>Thai</option>
                            <option value="Italian" {{selectedSourceItalian}}>Italian</option>
                            <option value="German" {{selectedSourceGerman}}>German</option> 
                        </select>
                        <select id="targetLang">
                            <option value="English" {{selectedTargetEnglish}}>English</option>
                            <option value="Chinese" {{selectedTargetChinese}}>Chinese</option>
                            <option value="Traditional Chinese" {{selectedTargetTraditionalChinese}}>Traditional Chinese</option>
                            <option value="Japanese" {{selectedTargetJapanese}}>Japanese</option>
                            <option value="Korean" {{selectedTargetKorean}}>Korean</option>
                            <option value="French" {{selectedTargetFrench}}>French</option>
                            <option value="Thai" {{selectedTargetThai}}>Thai</option>   
                            <option value="Italian" {{selectedTargetItalian}}>Italian</option>
                            <option value="German" {{selectedTargetGerman}}>German</option>
                        </select>
                        <input type="number" id="port" value="8080" min="1" max="65535">
                    </div>
                    <div id="actionButtons">
                        <button id="send" class="action-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                                aria-hidden="true" role="img" width="64" height="64" viewBox="0 0 24 24"
                                style="color: rgb(182, 190, 201);">
                                <g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">
                                    <path
                                        d="M5 14.997a.75.75 0 0 1 .75.75V18c0 .138.112.25.25.25h12a.25.25 0 0 0 .25-.25v-2.253a.75.75 0 0 1 1.5 0V18A1.75 1.75 0 0 1 18 19.75H6A1.75 1.75 0 0 1 4.25 18v-2.253a.75.75 0 0 1 .75-.75">
                                    </path>
                                    <path
                                        d="M12.202 5.58a.75.75 0 0 1 .75.75v8.086a.75.75 0 0 1-1.5 0V6.331a.75.75 0 0 1 .75-.75">
                                    </path>
                                    <path
                                        d="M11.678 4.464a.75.75 0 0 1 1.048 0L16.07 7.73a.75.75 0 0 1-1.048 1.073l-2.82-2.754l-2.82 2.754A.75.75 0 1 1 8.334 7.73z">
                                    </path>
                                </g>
                            </svg>
                        </button>

                        <button id="erase_history" title="Clear History">
                            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                                aria-hidden="true" role="img" width="64" height="64" viewBox="0 0 24 24"
                                style="color: rgb(182, 190, 201);">
                                <path fill="currentColor"
                                    d="M20.454 19.028h-7.01l6.62-6.63a2.94 2.94 0 0 0 .87-2.09a2.84 2.84 0 0 0-.87-2.05l-3.42-3.44a2.93 2.93 0 0 0-4.13.01L3.934 13.4a2.946 2.946 0 0 0 0 4.14l1.48 1.49h-1.86a.5.5 0 0 0 0 1h16.9a.5.5 0 0 0 0-1.002m-7.24-13.5a1.956 1.956 0 0 1 2.73 0l3.42 3.44a1.87 1.87 0 0 1 .57 1.35a1.93 1.93 0 0 1-.57 1.37l-5.64 5.64l-6.15-6.16Zm-1.19 13.5h-5.2l-2.18-2.2a1.93 1.93 0 0 1 0-2.72l2.23-2.23l6.15 6.15Z">
                                </path>
                            </svg>
                        </button>

                    </div>
                </div>
            </div>

</body>

<script>
    function messageBubble(text, isUser) {
        let msg_div = document.createElement('div');
        msg_div.textContent = text;
        if (isUser) msg_div.classList.add('message', 'user');
        else msg_div.classList.add('message', 'assistant');

        let control_div = null;
        if (!isUser) {
            control_div = document.createElement('div');
            control_div.classList.add('controls');
            control_div.innerHTML = `
            <button class="control-btn" onclick="copyText(this)" title="Copy">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M21 9v12a2 2 0 0 1-2 2H9"/></svg>
            </button>
            <button class="control-btn" onclick="regenerateText(this)" title="Regenerate">
                <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64M3.51 15A9 9 0 0 0 18.36 18.36"/></svg>
            </button>`;
        }

        let wrapper_div = document.createElement('div');
        wrapper_div.classList.add('message-wrapper');
        if (isUser) wrapper_div.classList.add('user');
        else wrapper_div.classList.add('assistant');
        wrapper_div.appendChild(msg_div);
        if (!isUser) wrapper_div.appendChild(control_div);
        return wrapper_div;
    }

    const vscode = acquireVsCodeApi();
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const eraseHistory = document.getElementById('erase_history');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const portInput = document.getElementById('port');


    sourceLang.addEventListener('change', () => {
        vscode.postMessage({ command: 'updateLanguage', sourceLang: sourceLang.value, targetLang: targetLang.value });
    });

    targetLang.addEventListener('change', () => {
        vscode.postMessage({ command: 'updateLanguage', sourceLang: sourceLang.value, targetLang: targetLang.value });
    });

    send.addEventListener('click', () => {
        const text = input.value.trim();
        if (text) {
            chat.appendChild(messageBubble(text, true));
            chat.scrollTop = chat.scrollHeight;
            const source = sourceLang.value;
            const target = targetLang.value;
            vscode.postMessage({ command: 'translate', text, sourceLang: source, targetLang: target });
            input.value = '';
        }
    });

    eraseHistory.addEventListener('click', () => {
        chat.innerHTML = '';
        vscode.postMessage({ command: 'clearHistory' });
    });
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send.click();
        }
    });



    function restoreHistory(history) {
        if (!Array.isArray(history)) {
            return;
        }
        history.forEach((item) => {
            const isUser = item.role === 'user';
            let content = '';
            if (isUser) {
                const index_of_content_start = item.content.indexOf('explanation:');
                content = item.content.slice(index_of_content_start + 12);
            } else {
                content = item.content;
            }
            chat.appendChild(messageBubble(content, isUser));
        });
        chat.scrollTop = chat.scrollHeight;
    }

    window.addEventListener('message', (event) => {
        const message = event.data;
        switch (message.command) {
            case 'translationResult':
                chat.appendChild(messageBubble(message.text, false));
                chat.scrollTop = chat.scrollHeight;
                break;
            case 'directTranslation':
                chat.appendChild(messageBubble(message.userText, true));
                chat.appendChild(messageBubble(message.translation, false));
                chat.scrollTop = chat.scrollHeight;
                break;
            case 'restoreHistory':
                restoreHistory(message.history);
                break;
            case 'error':
                chat.insertAdjacentHTML('beforeend', '<div class="message assistant" style="background: #831843; color: white;">' + message.text + '</div>');
                chat.scrollTop = chat.scrollHeight;
                break;
            case 'regenerationResult':
                const lastWrapper = chat.querySelector('.message-wrapper.assistant:last-child');
                if (lastWrapper) {
                    const msgDiv = lastWrapper.querySelector('.message.assistant');
                    if (msgDiv) {
                        msgDiv.textContent = message.text;
                    }
                    const regenBtn = lastWrapper.querySelector('.control-btn.regenerating');
                    if (regenBtn) {
                        regenBtn.classList.remove('regenerating');
                    }
                }
                break;
        }
    });

    window.addEventListener('load', () => {
        vscode.postMessage({ command: 'requestHistory' });
    });

    function copyText(button) {
        const msgWrapper = button.closest('.message-wrapper');
        const msgDiv = msgWrapper.querySelector('.message.assistant');
        if (msgDiv) {
            const text = msgDiv.textContent.trim();
            navigator.clipboard.writeText(text).then(() => {
                button.classList.add('copied');
                setTimeout(() => button.classList.remove('copied'), 1200);
            });
        }
    }

    function regenerateText(button) {
        if (button.classList.contains('regenerating')) return;
        const msgWrapper = button.closest('.message-wrapper.assistant');
        const prevWrapper = msgWrapper.previousElementSibling;
        if (prevWrapper && prevWrapper.classList.contains('message-wrapper') && prevWrapper.classList.contains('user')) {
            const userMsg = prevWrapper.querySelector('.message.user');
            if (userMsg) {
                const text = userMsg.textContent.trim();
                button.classList.add('regenerating');
                vscode.postMessage({ command: 'regenerate', text: text, sourceLang: sourceLang.value, targetLang: targetLang.value });
            }
        }
    }
</script>

</html>
